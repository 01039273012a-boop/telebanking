<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>텔레뱅킹</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f8;
  color:#16181c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding-bottom:95px;
}
.header{
  padding:24px 22px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:900;
}
.logo{
  width:42px;height:42px;
  border-radius:14px;
  background:#ffe500;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
}
.header-right{font-size:23px}

.user{
  padding:20px 22px 10px;
}
.hello{
  color:#777;
  font-size:14px;
}
.username{
  margin-top:5px;
  font-size:23px;
  font-weight:800;
}

.balance-card{
  margin:16px 18px;
  padding:25px 22px;
  border-radius:25px;
  background:#f7f8fa;
}
.small{
  font-size:14px;
  color:#6c737f;
}
.balance{
  margin-top:7px;
  font-size:38px;
  font-weight:900;
  letter-spacing:-1px;
}
.month{
  margin-top:20px;
  padding-top:17px;
  border-top:1px solid #e4e7eb;
  display:flex;
  justify-content:space-between;
}
.plus{
  color:#00a86b;
  font-weight:800;
}

.main-actions{
  padding:4px 18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.action{
  border:0;
  border-radius:22px;
  padding:22px 10px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}
.send{
  background:#ffe500;
  color:#111;
}
.receive{
  background:#eef1f5;
  color:#111;
}
.icon{
  display:block;
  font-size:29px;
  margin-bottom:8px;
}
.subtext{
  display:block;
  margin-top:5px;
  font-size:11px;
  font-weight:500;
  opacity:.6;
}

.quick{
  padding:18px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.quick button{
  background:#fff;
  border:1px solid #e9ebef;
  border-radius:19px;
  padding:17px 5px;
  font-weight:700;
  font-size:13px;
}
.qicon{
  display:block;
  font-size:25px;
  margin-bottom:7px;
}

.banner{
  margin:2px 18px;
  background:#eef7ff;
  border-radius:20px;
  padding:19px;
  display:flex;
  align-items:center;
  gap:13px;
}
.gift{font-size:32px}
.banner strong{
  display:block;
  margin-bottom:4px;
}
.banner span{
  font-size:12px;
  color:#687584;
}

.section{
  padding:26px 22px 8px;
  font-size:18px;
  font-weight:900;
}
.history{
  margin:0 18px;
  border-top:1px solid #eee;
}
.row{
  padding:17px 2px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}
.row-title{
  font-weight:700;
}
.row-time{
  margin-top:4px;
  font-size:12px;
  color:#999;
}
.out{color:#ef4d5b;font-weight:800}
.in{color:#00a86b;font-weight:800}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:78px;
  background:#fff;
  border-top:1px solid #eee;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  background:none;
  border:0;
  font-size:11px;
  color:#8a9099;
}
.nav .active{
  color:#111;
  font-weight:900;
}
.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:20;
  overflow:auto;
}
.overlay.show{display:block}
.page{
  max-width:480px;
  margin:auto;
  padding:22px;
}
.back{
  border:0;
  background:none;
  font-size:27px;
  padding:0;
}
.page h2{
  text-align:center;
  margin:-30px 0 35px;
}
.search{
  width:100%;
  border:0;
  background:#f4f6f8;
  border-radius:17px;
  padding:16px;
  font-size:16px;
}
.friend{
  display:flex;
  align-items:center;
  gap:13px;
  padding:17px 4px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.avatar{
  width:48px;height:48px;
  border-radius:50%;
  background:#ffe9c7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}
.friend-name{font-weight:800}
.handle{font-size:12px;color:#999;margin-top:3px}

.amount{
  width:100%;
  border:0;
  text-align:center;
  font-size:44px;
  font-weight:900;
  margin:60px 0 25px;
  outline:none;
}
.bigbtn{
  width:100%;
  border:0;
  border-radius:20px;
  padding:18px;
  background:#ffe500;
  font-size:18px;
  font-weight:900;
  margin-top:25px;
}
.center{text-align:center}
.check{
  margin:90px auto 25px;
  width:100px;height:100px;
  background:#23c875;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}
</style>
</head>

<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">T</div>
      텔레뱅킹
    </div>
    <div class="header-right">🔔　⚙️</div>
  </header>

  <section class="user">
    <div class="hello">안녕하세요 👋</div>
    <div class="username" id="userName">텔레뱅킹 고객님</div>
  </section>

  <section class="balance-card">
    <div class="small">내 포인트</div>
    <div class="balance" id="balance">0 P</div>

    <div class="month">
      <span class="small">이번 달 받은 포인트</span>
      <span class="plus" id="monthlyReceived">+0 P</span>
    </div>
  </section>

  <section class="main-actions">
    <button class="action send" onclick="openSend()">
      <span class="icon">✈️</span>
      보내기
      <span class="subtext">텔레그램 친구에게 보내기</span>
    </button>

    <button class="action receive" onclick="receivePoint()">
      <span class="icon">▣</span>
      받기
      <span class="subtext">QR · 링크로 받기</span>
    </button>
  </section>

  <section class="quick">
    <button onclick="openHistory()">
      <span class="qicon">📋</span>내역
    </button>
    <button onclick="openSend()">
      <span class="qicon">👥</span>친구
    </button>
    <button onclick="alert('이벤트 준비 중입니다.')">
      <span class="qicon">🎁</span>이벤트
    </button>
  </section>

  <section class="banner">
    <div class="gift">🎁</div>
    <div>
      <strong>친구와 함께 텔레뱅킹</strong>
      <span>친구에게 포인트를 선물해보세요!</span>
    </div>
  </section>

  <div class="section">최근 내역</div>

  <section class="history">
    <div class="row">
      <div>
        <div class="row-title">달이에게 보냄</div>
        <div class="row-time">오늘 오후 3:27</div>
      </div>
      <div class="out">-10,000 P</div>
    </div>

    <div class="row">
      <div>
        <div class="row-title">친구에게 받음</div>
        <div class="row-time">오늘 오후 2:14</div>
      </div>
      <div class="in">+10,000 P</div>
    </div>
  </section>
</div>

<nav class="nav">
  <button class="active">
    <span class="nav-icon">⌂</span>홈
  </button>
  <button onclick="openSend()">
    <span class="nav-icon">👥</span>친구
  </button>
  <button onclick="alert('이벤트 준비 중입니다.')">
    <span class="nav-icon">🎁</span>이벤트
  </button>
  <button onclick="alert('더보기 준비 중입니다.')">
    <span class="nav-icon">☰</span>더보기
  </button>
</nav>
<!-- 실제 거래내역 화면 -->
<div class="overlay" id="historyPage">
  <div class="page">
    <button class="back" onclick="closeHistory()">×</button>
    <h2>거래내역</h2>

    <div id="historyList">
      <div style="padding:30px 0;text-align:center;color:#888;">
        거래내역을 불러오는 중...
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="sendPage">
  <div class="page">
    <button class="back" onclick="closePage()">‹</button>
    <h2>보내기</h2>

   <input
  class="search"
  id="friendSearch"
  placeholder="이름 또는 @username 검색"
  oninput="searchFriends(this.value)"
>

    <h3>최근 친구</h3>
    <div id="searchResults"></div>

    <div class="friend" onclick="selectFriend('달이','@dali_puppy')">
      <div class="avatar">🐶</div>
      <div>
        <div class="friend-name">달이</div>
        <div class="handle">@dali_puppy</div>
      </div>
    </div>

    <div class="friend" onclick="selectFriend('별이','@byeoli_puppy')">
      <div class="avatar">🐕</div>
      <div>
        <div class="friend-name">별이</div>
        <div class="handle">@byeoli_puppy</div>
      </div>
    </div>

    <div class="friend" onclick="selectFriend('몽글이','@mongle_puppy')">
      <div class="avatar">🐶</div>
      <div>
        <div class="friend-name">몽글이</div>
        <div class="handle">@mongle_puppy</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="amountPage">
  <div class="page">
    <button class="back" onclick="backToFriends()">‹</button>
    <h2>보내기</h2>

    <div class="center">
      <div class="avatar" style="margin:auto">👤</div>
      <h3 id="selectedFriend">친구</h3>
      <div class="handle" id="selectedHandle"></div>
    </div>

    <input id="amountInput"
      class="amount"
      inputmode="numeric"
      placeholder="0 P">

    <button class="bigbtn" onclick="sendDemo()">다음</button>
  </div>
</div>

<div class="overlay" id="successPage">
  <div class="page center">
    <div class="check">✓</div>
    <h1>보냈어요!</h1>
    <p id="successText"></p>

    <button class="bigbtn" onclick="finishSend()">확인</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
const API_URL =
  "https://kwnxigztqnsoluifiupf.supabase.co/functions/v1/telebanking-api";

async function loadTeleBankingAccount() {
  try {
    if (!tg || !tg.initData) {
      console.log("Telegram Mini App 밖에서 실행 중");
      return;
    }

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        initData: tg.initData
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "계정 정보를 불러오지 못했습니다.");
    }

    const user = data.user;
   
document.getElementById("monthlyReceived").textContent =
  "+" + Number(data.monthlyReceived || 0).toLocaleString("ko-KR") + " P";
    
    // 실제 포인트 잔액 표시
    document.getElementById("balance").textContent =
      Number(user.balance || 0).toLocaleString("ko-KR") + " P";

    // DB에서 받은 이름 표시
    const displayName =
      [user.first_name, user.last_name]
        .filter(Boolean)
        .join(" ");

    if (displayName) {
      document.getElementById("userName").textContent = displayName;
    }

    console.log("텔레뱅킹 계정 연결 완료:", user.telegram_id);

  } catch (error) {
    console.error("텔레뱅킹 계정 연결 오류:", error);

    document.getElementById("balance").textContent = "연결 오류";
  }
}
if (tg) {
  tg.ready();
  tg.expand();

  loadTeleBankingAccount();

  const user = tg.initDataUnsafe?.user;

  if (user) {
    const name =
      [user.first_name, user.last_name]
      .filter(Boolean)
      .join(" ");

    document.getElementById("userName").textContent =
      name || "텔레뱅킹 고객님";
  }
}

let friendName = "";
let friendHandle = "";
async function openHistory() {
  const historyPage = document.getElementById("historyPage");
  const historyList = document.getElementById("historyList");

  historyPage.classList.add("show");

  historyList.innerHTML =
    '<div style="padding:30px 0;text-align:center;color:#888;">거래내역을 불러오는 중...</div>';

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        initData: tg.initData,
        action: "history"
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "HISTORY_FAILED");
    }

    const transactions = data.transactions || [];

    if (transactions.length === 0) {
      historyList.innerHTML =
        '<div style="padding:40px 0;text-align:center;color:#888;">아직 거래내역이 없습니다.</div>';
      return;
    }

    historyList.innerHTML = "";

    transactions.forEach((tx) => {
      const received = tx.type === "received";
      const amount = Number(tx.amount || 0).toLocaleString("ko-KR");

      const date = new Date(tx.created_at);

      const dateText = date.toLocaleString("ko-KR", {
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

      const item = document.createElement("div");

      item.style.cssText =
        "padding:18px 4px;border-bottom:1px solid #eee;" +
        "display:flex;justify-content:space-between;align-items:center;";

      const left = document.createElement("div");

      const title = document.createElement("div");
      title.style.cssText =
        "font-size:16px;font-weight:700;margin-bottom:6px;";

      title.textContent =
        received
          ? tx.otherName + "에게 받음"
          : tx.otherName + "에게 보냄";

      const time = document.createElement("div");
      time.style.cssText =
        "font-size:13px;color:#888;";

      time.textContent = dateText;

      left.appendChild(title);
      left.appendChild(time);

      const amountEl = document.createElement("div");

      amountEl.style.cssText =
        "font-size:17px;font-weight:800;" +
        (received ? "color:#00a878;" : "color:#16181c;");

      amountEl.textContent =
        (received ? "+" : "-") + amount + " P";

      item.appendChild(left);
      item.appendChild(amountEl);

      historyList.appendChild(item);
    });

  } catch (error) {
    console.error("거래내역 오류:", error);

    historyList.innerHTML =
      '<div style="padding:40px 0;text-align:center;color:#888;">거래내역을 불러오지 못했습니다.</div>';
  }
}

function closeHistory() {
  document.getElementById("historyPage").classList.remove("show");
}
function openSend(){
  document.getElementById("sendPage").classList.add("show");
}

function closePage(){
  document.getElementById("sendPage").classList.remove("show");
}

let friendTelegramId = null;
let searchTimer = null;

async function searchFriends(value) {
  clearTimeout(searchTimer);

  const results = document.getElementById("searchResults");
  const query = String(value || "").trim();

  if (query.replace(/^@/, "").length < 2) {
    results.innerHTML = "";
    return;
  }

  searchTimer = setTimeout(async () => {
    try {
      results.innerHTML = "<div style='padding:14px'>검색 중...</div>";

      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          initData: tg.initData,
          action: "search",
          query: query
        })
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(data.error || "SEARCH_FAILED");
      }

      if (!data.users || data.users.length === 0) {
        results.innerHTML =
          "<div style='padding:14px;color:#888'>검색 결과가 없습니다.</div>";
        return;
      }

      results.innerHTML = "";

      data.users.forEach((u) => {
        const name =
          [u.first_name, u.last_name]
            .filter(Boolean)
            .join(" ") ||
          u.username ||
          "텔레뱅킹 사용자";

        const handle = u.username ? "@" + u.username : "";

        const item = document.createElement("div");
        item.className = "friend";

        item.innerHTML = `
          <div class="avatar">👤</div>
          <div>
            <div class="friend-name"></div>
            <div class="handle"></div>
          </div>
        `;

        item.querySelector(".friend-name").textContent = name;
        item.querySelector(".handle").textContent = handle;

        item.onclick = () => {
          selectFriend(
            name,
            handle,
            Number(u.telegram_id)
          );
        };

        results.appendChild(item);
      });

    } catch (error) {
      console.error("친구 검색 오류:", error);

      results.innerHTML =
        "<div style='padding:14px;color:#888'>검색 중 오류가 발생했습니다.</div>";
    }
  }, 350);
}
function selectFriend(name, handle, telegramId){
  friendName = name;
  friendHandle = handle;
  friendTelegramId = telegramId;

  document.getElementById("selectedFriend").textContent = name;
  document.getElementById("selectedHandle").textContent = handle;

  document.getElementById("sendPage").classList.remove("show");
  document.getElementById("amountPage").classList.add("show");
}

function backToFriends(){
  document.getElementById("amountPage").classList.remove("show");
  document.getElementById("sendPage").classList.add("show");
}

async function sendDemo(){
  const value =
    document.getElementById("amountInput").value
      .replace(/[^0-9]/g,"");

  const amount = Number(value);

  if (!friendTelegramId) {
    alert("받을 친구를 먼저 선택해주세요.");
    return;
  }

  if (!Number.isSafeInteger(amount) || amount <= 0) {
    alert("보낼 포인트를 정확히 입력해주세요.");
    return;
  }

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        initData: tg.initData,
        action: "send",
        receiverId: friendTelegramId,
        amount: amount,
        memo: ""
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      if (data.error === "INSUFFICIENT_BALANCE") {
        alert("포인트가 부족합니다.");
        return;
      }

      if (data.error === "RECEIVER_NOT_FOUND") {
        alert("받는 사람의 텔레뱅킹 계정을 찾을 수 없습니다.");
        return;
      }

      if (data.error === "CANNOT_SEND_TO_SELF") {
        alert("본인에게는 포인트를 보낼 수 없습니다.");
        return;
      }

      throw new Error(data.error || "TRANSFER_FAILED");
    }

    const amountText = amount.toLocaleString("ko-KR");

    document.getElementById("successText").innerHTML =
      "<strong>" + friendName + "</strong>님에게<br>" +
      "<strong>" + amountText + " P</strong>를 보냈어요.";

    // 서버에서 받은 실제 송금 후 잔액
    document.getElementById("balance").textContent =
      Number(data.balance || 0).toLocaleString("ko-KR") + " P";

    document.getElementById("amountPage").classList.remove("show");
    document.getElementById("successPage").classList.add("show");

  } catch (error) {
    console.error("포인트 송금 오류:", error);
    alert("송금 중 오류가 발생했습니다. 다시 시도해주세요.");
  }
}

function finishSend(){
  document.getElementById("successPage").classList.remove("show");
  document.getElementById("amountInput").value = "";
}

function receivePoint(){
  alert(
    "받기 기능에서는 다음 단계에서\\n" +
    "내 QR코드와 포인트 받기 링크를 만들어드립니다."
  );
}
</script>

</body>
</html>
